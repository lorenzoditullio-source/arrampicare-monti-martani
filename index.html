        // ==========================================
        // 4. STATO APPLICAZIONE E PERSISTENZA
        // ==========================================
        let state = {
            view: 'home', // 'home' | 'intro' | 'routes' | 'detail'
            mapEditMode: false,
            mapLayer: 'topo',
            selectedIntroId: null,
            selectedSectorId: 'all',
            selectedRouteId: null,
            searchQuery: '',
            activeFilter: 'all',
            onlyCompleted: false,
            expandedPitchIndex: 0,
            completedRoutes: JSON.parse(localStorage.getItem('martani_v21_completed') || '[]'),
            checkedPitches: JSON.parse(localStorage.getItem('martani_v21_pitches') || '{}')
        };

        function saveState() {
            localStorage.setItem('martani_v21_completed', JSON.stringify(state.completedRoutes));
            localStorage.setItem('martani_v21_pitches', JSON.stringify(state.checkedPitches));
            updateCompletedCounter();
        }

        function updateCompletedCounter() {
            const ids = ['completed-counter', 'desk-completed-counter'];
            const totals = ['total-counter', 'desk-total-counter'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = state.completedRoutes.length;
            });
            totals.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = routesData.length;
            });
        }

        let toastTimeout = null;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            const label = document.getElementById('toast-message');
            if (!box || !label) return;
            label.textContent = msg;
            box.classList.remove('opacity-0');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                box.classList.add('opacity-0');
            }, 2600);
        }

        function copyToClipboard(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(successMsg || 'Copiato negli appunti!');
            } catch (err) {
                showToast('Impossibile copiare automaticamente');
            }
            document.body.removeChild(textarea);
        }

        function getGradeBadgeColor(grade) {
            const g = (grade || '').toLowerCase();
            if (g.startsWith('7') || g.startsWith('8') || g.includes('td')) {
                return 'bg-rose-50 text-rose-700 border-rose-200';
            }
            if (g.startsWith('6b') || g.startsWith('6c') || g.includes('vi')) {
                return 'bg-amber-50 text-amber-800 border-amber-200';
            }
            return 'bg-emerald-50 text-emerald-700 border-emerald-200';
        }

        // ==========================================
        // 5. NAVIGAZIONE E AZIONI UTENTE
        // ==========================================
        function updateNavActiveState() {
            const activeView = state.view === 'detail' ? 'routes' : state.view;
            ['home', 'intro', 'routes'].forEach(v => {
                const mobBtn = document.getElementById(`nav-${v}`);
                const deskBtn = document.getElementById(`desk-nav-${v}`);
                const isActive = activeView === v;

                if (mobBtn) {
                    mobBtn.className = isActive
                        ? 'flex flex-col items-center gap-0.5 text-orange-600 font-semibold text-xs px-3 py-1.5 rounded-xl transition'
                        : 'flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 font-medium text-xs px-3 py-1.5 rounded-xl transition';
                }
                if (deskBtn) {
                    deskBtn.className = isActive
                        ? 'px-3.5 py-2 rounded-xl text-xs font-bold bg-stone-800 text-orange-400 transition'
                        : 'px-3.5 py-2 rounded-xl text-xs font-semibold text-stone-300 hover:text-white hover:bg-stone-800/60 transition';
                }
            });
        }

        function navigateTo(viewName) {
            state.view = viewName;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openIntroChapter(chapterId) {
            state.selectedIntroId = chapterId;
            state.view = 'intro';
            render();
            setTimeout(() => {
                const target = document.getElementById(`intro-card-${chapterId}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 60);
        }

        function openSectorRoutes(sectorId, optionalSearchQuery) {
            state.selectedSectorId = sectorId || 'all';
            state.searchQuery = optionalSearchQuery || '';
            state.view = 'routes';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openRouteDetail(routeId) {
            state.selectedRouteId = routeId;
            state.expandedPitchIndex = 0;
            state.view = 'detail';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
            render();
            const input = document.getElementById('routes-search-input');
            if (input) {
                input.focus();
                input.setSelectionRange(val.length, val.length);
            }
        }

        function setFilter(filterKey) {
            state.activeFilter = filterKey;
            render();
        }

        function toggleOnlyCompleted() {
            state.onlyCompleted = !state.onlyCompleted;
            render();
        }

        function toggleRouteCompleted(routeId, event) {
            if (event) event.stopPropagation();
            const idx = state.completedRoutes.indexOf(routeId);
            if (idx === -1) {
                state.completedRoutes.push(routeId);
                showToast('Segnata come salita! ✓');
            } else {
                state.completedRoutes.splice(idx, 1);
                showToast('Rimossa dalle vie salite');
            }
            saveState();
            render();
        }

        function togglePitchAccordion(idx) {
            state.expandedPitchIndex = state.expandedPitchIndex === idx ? -1 : idx;
            render();
        }

        function togglePitchChecked(routeId, idx, event) {
            if (event) event.stopPropagation();
            const key = `${routeId}_${idx}`;
            state.checkedPitches[key] = !state.checkedPitches[key];
            saveState();
            render();
        }

        function openPhotoLightbox(url, caption) {
            const lb = document.getElementById('photo-lightbox');
            const img = document.getElementById('lightbox-img');
            const cap = document.getElementById('lightbox-caption');
            if (!lb || !img) return;
            img.src = url;
            if (cap) cap.textContent = caption || '';
            lb.classList.remove('hidden');
        }

        function closePhotoLightbox() {
            const lb = document.getElementById('photo-lightbox');
            if (lb) lb.classList.add('hidden');
        }

        // ==========================================
        // MAPPA LEAFLET (TOPO + SATELLITE + GOOGLE MAPS)
        // ==========================================
        let martaniMap = null;
        let currentTileLayer = null;

        function setMapLayer(layerType) {
            state.mapLayer = layerType;
            render();
        }

        function toggleMapEditMode() {
            state.mapEditMode = !state.mapEditMode;
            render();
            if (state.mapEditMode) {
                showToast('Trascina i pin sulla mappa per spostarli!');
            }
        }

        function copyCalibratedLocations() {
            const summary = mapLocations
                .map(l => `- [${l.code}] ${l.title}: lat: ${l.lat.toFixed(4)}, lng: ${l.lng.toFixed(4)}`)
                .join('\n');
            copyToClipboard(summary, 'Coordinate calibrate copiate negli appunti!');
        }

        function resetMapLocations() {
            localStorage.removeItem('martani_calibrated_pins_v21');
            mapLocations = JSON.parse(JSON.stringify(defaultMapLocations));
            render();
            showToast('Ripristinate le coordinate calibrate originali');
        }

        function initMartaniMap() {
            const mapEl = document.getElementById('martani-leaflet-map');
            if (!mapEl || typeof L === 'undefined') return;

            if (martaniMap) {
                martaniMap.remove();
                martaniMap = null;
            }

            martaniMap = L.map('martani-leaflet-map', {
                center: [42.6075, 12.6065],
                zoom: 14,
                scrollWheelZoom: false
            });

            if (state.mapLayer === 'sat') {
                currentTileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 18,
                    attribution: '© Esri, Maxar, Earthstar Geographics'
                }).addTo(martaniMap);
            } else {
                currentTileLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    maxZoom: 17,
                    attribution: '© OpenStreetMap, SRTM | OpenTopoMap'
                }).addTo(martaniMap);
            }

            mapLocations.forEach(loc => {
                const isSector = loc.kind === 'sector';
                const dragRing = state.mapEditMode ? 'outline: 3px dashed #f59e0b; outline-offset: 2px; cursor: grab;' : '';
                const iconHtml = isSector
                    ? `<div style="background:#ea580c;color:#fff;width:30px;height:30px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.35);${dragRing}">${loc.code}</div>`
                    : `<div style="background:#1d4ed8;color:#fff;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.3);${dragRing}">${loc.code || 'P'}</div>`;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: isSector ? [30, 30] : [26, 26],
                    iconAnchor: isSector ? [15, 15] : [13, 13]
                });

                const gmapsDirUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat.toFixed(5)},${loc.lng.toFixed(5)}`;
                const filterArg = loc.filterQuery ? `'${loc.filterQuery.replace(/'/g, "\\'")}'` : `''`;

                const popupHtml = `
                    <div style="min-width:205px;max-width:240px;">
                        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:${isSector ? '#c2410c' : '#1d4ed8'};margin-bottom:2px;">
                            ${isSector ? `Settore [${loc.code}]` : `Parcheggio [${loc.code}]`}
                        </div>
                        <div style="font-size:13px;font-weight:800;color:#1c1917;line-height:1.25;margin-bottom:4px;">
                            ${loc.title}
                        </div>
                        <div style="font-size:10px;font-family:monospace;color:#78716c;margin-bottom:5px;">
                            GPS: ${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}
                        </div>
                        <div style="font-size:11px;color:#57534e;line-height:1.35;margin-bottom:10px;">
                            ${loc.subtitle}
                        </div>
                        <div style="display:flex;flex-direction:column;gap:6px;">
                            ${isSector ? `
                                <button
                                    onclick="openSectorRoutes('${loc.sectorId}', ${filterArg})"
                                    style="background:#ea580c;color:#fff;border:none;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;width:100%;"
                                >
                                    Vedi schede vie del settore →
                                </button>
                            ` : ''}
                            <a
                                href="${gmapsDirUrl}"
                                target="_blank"
                                rel="noopener noreferrer"
                                style="background:#1c1917;color:#fff;text-decoration:none;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:700;text-align:center;display:block;"
                            >
                                📍 Naviga con Google Maps
                            </a>
                        </div>
                    </div>
                `;

                const marker = L.marker([loc.lat, loc.lng], {
                    icon: customIcon,
                    draggable: !!state.mapEditMode
                }).addTo(martaniMap);

                if (state.mapEditMode) {
                    marker.on('dragend', function(e) {
                        const pos = e.target.getLatLng();
                        loc.lat = Number(pos.lat.toFixed(4));
                        loc.lng = Number(pos.lng.toFixed(4));
                        localStorage.setItem('martani_calibrated_pins_v21', JSON.stringify(mapLocations));
                        showToast(`[${loc.code}] ${loc.title}: ${loc.lat}, ${loc.lng}`);
                    });
                } else {
                    marker.bindPopup(popupHtml);
                }
            });
        }

        // ==========================================
        // 7. SCHERMATA 2: CAPITOLI INTRODUTTIVI
        // ==========================================
        function renderIntroScreen() {
            return `
                <div class="fade-in px-4 pt-5 pb-10 max-w-4xl mx-auto">
                    <div class="mb-5">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-orange-700">Capitolo 1</span>

                    <div class="space-y-4">

                                    <div>
                                        <h2 class="text-base sm:text-lg font-extrabold text-stone-900 leading-snug">${ch.title}</h2>
                                        <p class="text-xs text-stone-500">${ch.subtitle}</p>
                                    </div>
                                </div>
                                <div class="space-y-3 text-xs sm:text-sm text-stone-700 leading-relaxed">
                                    ${ch.content.map(p => `<p>${p}</p>`).join('')}
                                </div>
                                ${ch.images && ch.images.length ? `
                                    <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${ch.images.map(img => `
                                            <figure onclick="openPhotoLightbox('${img.url}', '${img.caption.replace(/'/g, "\'")}')" class="cursor-zoom-in group bg-stone-50 rounded-2xl p-2 border border-stone-200 overflow-hidden">
                                                <img src="${img.url}" alt="${img.caption}" class="w-full h-44 object-contain rounded-xl bg-white group-hover:scale-[1.02] transition" />
                                                <figcaption class="text-[11px] text-stone-500 mt-1.5 px-1">${img.caption}</figcaption>
                                            </figure>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </article>
                        `).join('')}

                        <article class="bg-stone-900 text-stone-200 rounded-3xl p-5 sm:p-6">
                            <h3 class="text-sm font-extrabold text-white mb-2">📚 Bibliografia e Sitografia</h3>
                            <ul class="text-xs space-y-1.5 text-stone-300 list-disc pl-4">
                                <li><em>Al di là delle ciminiere — Salite su roccia nel ternano</em>, CAI Terni (1988).</li>
                                  <li>Archivio storico montimartani.it, climbook.com e falesia.it.</li>
                            </ul>
                        </article>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 8. SCHERMATA 3: ELENCO VIE & FALESIE
        // ==========================================
        function getFilteredRoutes() {
            return routesData.filter(route => {
                if (state.selectedSectorId !== 'all' && route.sectorId !== state.selectedSectorId) return false;
                if (state.onlyCompleted && !state.completedRoutes.includes(route.id)) return false;

                if (state.activeFilter === 'multipitch' && route.type !== 'multipitch') return false;
                if (state.activeFilter === 'falesia' && route.type !== 'falesia') return false;
                if (state.activeFilter === 'easy' && route.difficultyLevel !== 'facile') return false;
                if (state.activeFilter === 'trad' && route.protectionCategory !== 'trad') return false;

                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const hay = `${route.name} ${route.sector} ${route.gradeMax} ${route.openers || ''} ${route.summary}`.toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        }

        function renderRoutesListView() {
            const filtered = getFilteredRoutes();
            const filters = [
                { key: 'all', label: 'Tutte' },
                { key: 'multipitch', label: 'Multipitch' },
                { key: 'falesia', label: 'Falesie' },
                { key: 'easy', label: 'Max 6a / Classiche facili' },
                { key: 'trad', label: 'Alpinistiche / Trad' }
            ];

            return `
                <div class="fade-in px-4 pt-5 pb-8">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                        <div>
                            <h1 class="text-xl sm:text-2xl font-extrabold text-stone-900 tracking-tight">Elenco Vie e Falesie</h1>
                            <p class="text-xs text-stone-500">${filtered.length} schede trovate nei Monti Martani</p>
                        </div>

                        <select
                            onchange="openSectorRoutes(this.value)"
                            class="bg-white border border-stone-300 text-stone-800 text-xs font-bold rounded-xl px-3 py-2 focus:outline-none focus:border-orange-500"
                        >
                            <option value="all" ${state.selectedSectorId === 'all' ? 'selected' : ''}>Tutti i settori (${routesData.length})</option>
                            ${sectorsData.map(s => `
                                <option value="${s.id}" ${state.selectedSectorId === s.id ? 'selected' : ''}>${s.code}. ${s.shortName}</option>
                            `).join('')}
                        </select>
                    </div>

                    <!-- Barra Ricerca -->
                    <div class="relative mb-3">
                        <input
                            id="routes-search-input"
                            type="text"
                            value="${state.searchQuery}"
                            oninput="handleSearchInput(this.value)"
                            placeholder="Cerca nome via, settore (es. Sant’Andrea), grado (es. 6a, IV+), apritore..."
                            class="w-full bg-white border border-stone-300 rounded-2xl pl-9 pr-4 py-2.5 text-xs sm:text-sm text-stone-900 placeholder:text-stone-400 focus:outline-none focus:border-orange-500"
                        />
                        <svg class="w-4 h-4 text-stone-400 absolute left-3 top-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z" />
                        </svg>
                    </div>

                    <!-- Filtri Rapidi -->
                    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-4">
                        ${filters.map(f => `
                            <button
                                onclick="setFilter('${f.key}')"
                                class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                                    state.activeFilter === f.key
                                        ? 'bg-stone-900 text-white border-stone-900'
                                        : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'
                                }"
                            >
                                ${f.label}
                            </button>
                        `).join('')}
                        <button
                            onclick="toggleOnlyCompleted()"
                            class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                                state.onlyCompleted
                                    ? 'bg-emerald-600 text-white border-emerald-600'
                                    : 'bg-white text-stone-600 border-stone-200 hover:border-stone-400'
                            }"
                        >
                            ✓ Salite (${state.completedRoutes.length})
                        </button>
                    </div>

                    ${filtered.length === 0 ? `
                        <div class="bg-white rounded-3xl p-8 text-center border border-stone-200">
                            <p class="text-sm font-bold text-stone-700 mb-1">Nessuna via corrisponde ai filtri</p>
                            <p class="text-xs text-stone-500 mb-4">Prova a resettare la ricerca o cambiare settore.</p>
                            <button onclick="state.activeFilter='all';state.selectedSectorId='all';state.searchQuery='';state.onlyCompleted=false;render();" class="px-4 py-2 bg-orange-600 text-white text-xs font-bold rounded-xl">
                                Mostra tutte le schede
                            </button>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
                            ${filtered.map(r => {
                                const isDone = state.completedRoutes.includes(r.id);
                                const isCrag = r.type === 'falesia';
                                return `
                                    <article
                                        onclick="openRouteDetail('${r.id}')"
                                        class="bg-white hover:border-orange-400 active:scale-[0.99] rounded-2xl p-4 border ${isDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-stone-200'} shadow-2xs transition cursor-pointer flex flex-col justify-between"
                                    >
                                        <div>
                                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                                <span class="text-[10px] font-bold uppercase tracking-wider text-stone-500 line-clamp-1">${r.sector}</span>
                                                <span class="shrink-0 font-mono-code text-xs font-extrabold px-2 py-0.5 rounded-lg border ${getGradeBadgeColor(r.gradeMax)}">
                                                    ${r.gradeMax}
                                                </span>
                                            </div>

                                            <h2 class="text-sm sm:text-base font-extrabold text-stone-900 leading-snug mb-1">${r.name}</h2>
                                            <p class="text-xs text-stone-600 line-clamp-2 leading-relaxed mb-3">${r.summary}</p>
                                        </div>

                                        <div class="pt-2.5 border-t border-stone-100 flex items-center justify-between gap-2">
                                            <div class="flex items-center gap-1.5 flex-wrap">
                                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${isCrag ? 'bg-blue-50 text-blue-700' : 'bg-orange-50 text-orange-700'}">
                                                    ${isCrag ? 'Falesia' : `${r.pitchesCount} tiri`}
                                                </span>
                                                <span class="text-[11px] font-semibold text-stone-500">${r.length}</span>
                                            </div>

                                            <button
                                                onclick="toggleRouteCompleted('${r.id}', event)"
                                                class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
                                                    isDone
                                                        ? 'bg-emerald-600 text-white border-emerald-600'
                                                        : 'bg-stone-50 text-stone-500 border-stone-200 hover:border-emerald-400'
                                                }"
                                            >
                                                ${isDone ? '✓ Salita' : 'Segna'}
                                            </button>
                                        </div>
                                    </article>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        // ==========================================
        // 9. SCHERMATA 4: SCHEDA DETTAGLIO VIA / FALESIA
        // ==========================================
        function renderDetailView() {
            const route = routesData.find(r => r.id === state.selectedRouteId) || routesData[0];
            const isDone = state.completedRoutes.includes(route.id);
            const isCrag = route.type === 'falesia';

            return `
                <div class="fade-in px-4 pt-4 pb-10">
                    <div class="flex items-center justify-between gap-2 mb-4">
                        <button
                            onclick="navigateTo('routes')"
                            class="inline-flex items-center gap-1.5 text-xs font-bold text-stone-700 hover:text-stone-900 bg-white px-3 py-2 rounded-xl border border-stone-200 shadow-2xs"
                        >
                            ← Elenco vie
                        </button>

                        <button
                            onclick="toggleRouteCompleted('${route.id}', event)"
                            class="inline-flex items-center gap-1.5 text-xs font-bold px-3.5 py-2 rounded-xl border transition ${
                                isDone
                                    ? 'bg-emerald-600 text-white border-emerald-600'
                                    : 'bg-white text-stone-700 border-stone-200 hover:border-emerald-400'
                            }"
                        >
                            ${isDone ? '✓ Via salita' : 'Segna come salita'}
                        </button>
                    </div>

                    <!-- Intestazione Scheda -->
                    <div class="bg-white rounded-3xl p-5 sm:p-6 border border-stone-200 shadow-2xs mb-5">
                        <div class="flex flex-wrap items-center gap-2 mb-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-orange-700 bg-orange-50 px-2.5 py-0.5 rounded-lg">
                                ${route.sector}
                            </span>
                            <span class="font-mono-code text-xs font-extrabold px-2.5 py-0.5 rounded-lg border ${getGradeBadgeColor(route.gradeMax)}">
                                Max ${route.gradeMax} (${route.gradeObbl} obbl.)
                            </span>
                        </div>

                        <h1 class="text-xl sm:text-2xl font-extrabold text-stone-900 tracking-tight mb-1">${route.name}</h1>
                        <p class="text-xs text-stone-500 mb-4">Apritori / Attrezzatori: <strong class="text-stone-700">${route.openers}</strong></p>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                            <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/70">
                                <div class="text-[10px] font-bold uppercase text-stone-400">Sviluppo</div>
                                <div class="font-extrabold text-stone-900 mt-0.5">${route.length}</div>
                            </div>
                            <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/70">
                                <div class="text-[10px] font-bold uppercase text-stone-400">Esposizione</div>
                                <div class="font-extrabold text-stone-900 mt-0.5">${route.exposure}</div>
                            </div>
                            <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/70">
                                <div class="text-[10px] font-bold uppercase text-stone-400">${isCrag ? 'Stagione' : 'Tempo Salita'}</div>
                                <div class="font-extrabold text-stone-900 mt-0.5">${route.climbTime}</div>
                            </div>
                            <div class="bg-stone-50 p-3 rounded-2xl border border-stone-200/70">
                                <div class="text-[10px] font-bold uppercase text-stone-400">${isCrag ? 'Quota / Avv.' : 'Discesa'}</div>
                                <div class="font-extrabold text-stone-900 mt-0.5">${route.descentTime}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Layout a 2 Colonne su Desktop -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
                        <!-- Colonna Sinistra (5 col): Foto, Schizzo Interattivo, Avvicinamento & Materiale -->
                        <div class="lg:col-span-5 space-y-4">
                            ${route.photoUrl ? `
                                <div class="bg-white rounded-3xl p-3 border border-stone-200 shadow-2xs">
                                    <div onclick="openPhotoLightbox('${route.photoUrl}', '${(route.photoCaption || '').replace(/'/g, "\\'")}')" class="relative cursor-zoom-in group overflow-hidden rounded-2xl">
                                        <img src="${route.photoUrl}" alt="${route.name}" class="w-full h-auto object-cover group-hover:scale-[1.02] transition duration-300" />
                                        <span class="absolute bottom-2 right-2 bg-stone-900/80 text-white text-[10px] font-bold px-2.5 py-1 rounded-lg">
                                            🔍 Ingrandisci
                                        </span>
                                    </div>
                                    ${route.photoCaption ? `<p class="text-[11px] text-stone-500 mt-2 px-1">${route.photoCaption}</p>` : ''}
                                    ${route.gallery && route.gallery.length ? `
                                        <div class="mt-3 pt-3 border-t border-stone-100 grid grid-cols-2 gap-2">
                                            ${route.gallery.map(g => `
                                                <div onclick="openPhotoLightbox('${g.url}', '${g.caption.replace(/'/g, "\'")}')" class="cursor-zoom-in group bg-stone-50 rounded-xl p-1.5 border border-stone-200 overflow-hidden">
                                                    <img src="${g.url}" alt="${g.caption}" class="w-full h-24 object-cover rounded-lg group-hover:scale-[1.03] transition" />
                                                    <p class="text-[10px] text-stone-500 mt-1 line-clamp-2 leading-tight">${g.caption}</p>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}

                            ${!isCrag && route.svgPath ? `
                                <div class="bg-stone-900 text-white rounded-3xl p-4 shadow-xs">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-xs font-bold text-orange-400">Schizzo Soste Interattivo</span>
                                        <span class="text-[10px] text-stone-400">Tocca una sosta per aprire il tiro</span>
                                    </div>
                                    <svg viewBox="0 0 240 230" class="w-full h-auto bg-stone-800/80 rounded-2xl border border-stone-700">
                                        <polygon points="15,220 45,35 195,20 225,220" fill="#292524" stroke="#44403c" stroke-width="1.5" />
                                        <polyline
                                            points="${route.svgPath.map(p => `${p.x},${p.y}`).join(' ')}"
                                            fill="none"
                                            stroke="#f97316"
                                            stroke-width="2.5"
                                            stroke-dasharray="5,3"
                                        />
                                        ${route.svgPath.map(pt => `
                                            <g onclick="${pt.pitchIndex !== undefined ? `togglePitchAccordion(${pt.pitchIndex})` : ''}" class="${pt.pitchIndex !== undefined ? 'cursor-pointer' : ''}">
                                                <circle cx="${pt.x}" cy="${pt.y}" r="6" fill="${pt.pitchIndex === state.expandedPitchIndex ? '#ea580c' : '#1c1917'}" stroke="#fb923c" stroke-width="2" />
                                                <text x="${pt.x + 10}" y="${pt.y + 3}" fill="#fafaf9" font-size="9" font-weight="700">${pt.label}</text>
                                            </g>
                                        `).join('')}
                                    </svg>
                                </div>
                            ` : ''}

                            <!-- Avvicinamento, Materiale e Discesa -->
                            <div class="bg-white rounded-3xl p-5 border border-stone-200 space-y-3.5 text-xs sm:text-sm">
                                <div>
                                    <div class="text-[11px] font-bold uppercase text-stone-400 mb-1">🥾 Avvicinamento</div>
                                    <p class="text-stone-700 leading-relaxed">${route.approach}</p>
                                    <div class="mt-2 flex items-center justify-between gap-2 bg-stone-50 px-3 py-2 rounded-xl border border-stone-200/80">
                                        <span class="font-mono-code text-[11px] text-stone-700 truncate">${route.gpsCoords}</span>
                                        <button onclick="copyToClipboard('${route.gpsCoords.replace(/'/g, "\\'")}', 'Coordinate GPS copiate!')" class="shrink-0 text-[11px] font-bold text-orange-700 hover:underline">
                                            Copia
                                        </button>
                                    </div>
                                </div>

                                <div class="pt-3 border-t border-stone-100">
                                    <div class="text-[11px] font-bold uppercase text-stone-400 mb-1">🧗 Chiodatura e Materiale</div>
                                    <p class="text-stone-700">${route.protectionType} — ${route.gear}</p>
                                </div>

                                <div class="pt-3 border-t border-stone-100">
                                    <div class="text-[11px] font-bold uppercase text-stone-400 mb-1">⬇️ Discesa / Calata</div>
                                    <p class="text-stone-700 leading-relaxed">${route.descent}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Colonna Destra (7 col): Relazione Tiro per Tiro oppure Tabella Vie Falesia -->
                        <div class="lg:col-span-7">
                            ${isCrag ? `
                                <div class="bg-white rounded-3xl p-5 border border-stone-200 shadow-2xs">
                                    <h2 class="text-base font-extrabold text-stone-900 mb-3">Elenco Vie della Falesia (${(route.cragRoutes || []).length})</h2>
                                    ${(route.cragRoutes || []).length === 0 ? `
                                        <p class="text-xs text-stone-500">Nessun singolo tiro tabellato per questa area.</p>
                                    ` : `
                                        <div class="overflow-x-auto">
                                            <table class="w-full text-left border-collapse text-xs">
                                                <thead>
                                                    <tr class="border-b border-stone-200 text-[10px] font-bold uppercase text-stone-400">
                                                        <th class="py-2 pr-2">Via</th>
                                                        <th class="py-2 px-2">Grado</th>
                                                        <th class="py-2 px-2">Metri</th>
                                                        <th class="py-2 pl-2 text-right">Bellezza</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-stone-100">
                                                    ${route.cragRoutes.map(cr => `
                                                        <tr class="hover:bg-stone-50">
                                                            <td class="py-2.5 pr-2">
                                                                <div class="font-bold text-stone-900">${cr.name}</div>
                                                                ${cr.sectorTag ? `<div class="text-[10px] text-stone-400">${cr.sectorTag}</div>` : ''}
                                                            </td>
                                                            <td class="py-2.5 px-2">
                                                                <span class="font-mono-code font-bold px-2 py-0.5 rounded border ${getGradeBadgeColor(cr.grade)}">${cr.grade}</span>
                                                            </td>
                                                            <td class="py-2.5 px-2 text-stone-500">${cr.meters || '-'}</td>
                                                            <td class="py-2.5 pl-2 text-right font-mono-code text-amber-600 font-bold">${cr.stars || ''}</td>
                                                        </tr>
                                                    `).join('')}
                                                </tbody>
                                            </table>
                                        </div>
                                    `}
                                </div>
                            ` : `
                                <div class="space-y-2.5">
                                    <div class="flex items-center justify-between mb-1">
                                        <h2 class="text-base font-extrabold text-stone-900">Relazione Tiro per Tiro (${route.pitches.length})</h2>
                                        <span class="text-[11px] text-stone-500">Spunta i tiri saliti</span>
                                    </div>

                                    ${route.pitches.map((p, idx) => {
                                        const isExpanded = state.expandedPitchIndex === idx;
                                        const isPitchDone = !!state.checkedPitches[`${route.id}_${idx}`];
                                        return `
                                            <div class="bg-white rounded-2xl border ${isPitchDone ? 'border-emerald-300 bg-emerald-50/20' : 'border-stone-200'} overflow-hidden shadow-2xs">
                                                <div
                                                    onclick="togglePitchAccordion(${idx})"
                                                    class="p-3.5 sm:p-4 flex items-center justify-between gap-2 cursor-pointer hover:bg-stone-50/70 transition"
                                                >
                                                    <div class="flex items-center gap-2.5">
                                                        <button
                                                            onclick="togglePitchChecked('${route.id}', ${idx}, event)"
                                                            class="w-6 h-6 rounded-lg border flex items-center justify-center text-xs font-bold transition ${
                                                                isPitchDone
                                                                    ? 'bg-emerald-600 border-emerald-600 text-white'
                                                                    : 'bg-white border-stone-300 text-transparent hover:border-emerald-500'
                                                            }"
                                                        >
                                                            ✓
                                                        </button>
                                                        <span class="font-extrabold text-sm text-stone-900">${p.num}</span>
                                                        <span class="font-mono-code text-xs font-extrabold px-2 py-0.5 rounded-lg border ${getGradeBadgeColor(p.grade)}">${p.grade}</span>
                                                        <span class="text-xs font-semibold text-stone-500">${p.length}</span>
                                                    </div>
                                                    <span class="text-xs text-stone-400 font-bold">${isExpanded ? '▲' : '▼'}</span>
                                                </div>
                                                ${isExpanded ? `
                                                    <div class="px-4 pb-4 pt-1 border-t border-stone-100 text-xs sm:text-sm text-stone-700 leading-relaxed">
                                                        <div class="text-[11px] font-semibold text-stone-400 mb-1">Protezioni: ${p.bolts}</div>
                                                        <p>${p.desc}</p>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 10. RENDERING PRINCIPALE & SUPPORTO OFFLINE
        // ==========================================
        function render() {
            const container = document.getElementById('app-scroll-container');
            if (!container) return;

            updateNavActiveState();

            if (state.view === 'home') {
                container.innerHTML = renderHomeScreen();
                setTimeout(initMartaniMap, 20);
            } else if (state.view === 'intro') {
                container.innerHTML = renderIntroScreen();
            } else if (state.view === 'routes') {
                container.innerHTML = renderRoutesListView();
            } else if (state.view === 'detail') {
                container.innerHTML = renderDetailView();
            }
        }

        function setupOfflineSupport() {
            const updateOnlineIndicator = () => {
                const label = document.getElementById('offline-label');
                const dot = document.getElementById('offline-dot');
                if (!label || !dot) return;
                if (navigator.onLine) {
                    label.textContent = 'Pronta Offline';
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                } else {
                    label.textContent = 'Modalità Offline';
                    dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                }
            };

            window.addEventListener('online', updateOnlineIndicator);
            window.addEventListener('offline', updateOnlineIndicator);
            updateOnlineIndicator();

            if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                const swCode = `
                    const CACHE_NAME = 'martani-guida-v21';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                        self.skipWaiting();
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(cached => cached || fetch(e.request).then(resp => {
                                const copy = resp.clone();
                                caches.open(CACHE_NAME).then(c => c.put(e.request, copy));
                                return resp;
                            }).catch(() => cached))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            }
        }

        function downloadOfflineCopy() {
            try {
                const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'arrampicare-monti-martani-offline.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Copia offline scaricata sul dispositivo!');
            } catch (err) {
                showToast('Usa Salva Pagina del browser per salvare offline');
            }
        }

        window.onload = function() {
            updateCompletedCounter();
            setupOfflineSupport();
            render();
        };
    </script>
</body>
</html>

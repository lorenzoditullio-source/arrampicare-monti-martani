            msgEl.textContent = msg;
            box.classList.remove('opacity-0');

            window._toastTimer = setTimeout(() => {
                box.classList.add('opacity-0');
            }, 2400);

        function getGradeBadgeColor(grade) {
            if (!grade) return 'bg-stone-100 text-stone-800 border-stone-200';
            const g = grade.toLowerCase();
            if (g.includes('ii') || g.includes('iii') || g.includes('iv') || g.startsWith('4') || g.startsWith('5')) {
                return 'bg-emerald-100 text-emerald-800 border-emerald-200';

            if (g.startsWith('6a') || g.startsWith('6b') || g.startsWith('v')) {
                return 'bg-amber-100 text-amber-800 border-amber-200';

        function generateRoutesCardsHTML() {
            const filtered = getFilteredRoutes();

            if (filtered.length === 0) {
                return `

                        <p class="text-sm font-semibold text-stone-700 mb-1">Nessuna via trovata</p>

                            Mostra tutte le vie
                        </button>
                    </div>
                `;
            }

            return filtered.map(route => {
                const isDone = state.completedRoutes.includes(route.id);
                const isFalesia = route.type === 'falesia';
                const gradeClass = isFalesia
                    ? 'bg-sky-100 text-sky-900 border-sky-200'
                    : getGradeBadgeColor(route.gradeMax);

                return `
                    <article
                        onclick="openRouteDetail('${route.id}')"

                    <!-- Avvicinamento -->
                    <div class="px-4 pt-5">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">1. Avvicinamento</h2>
                        <div class="bg-white rounded-2xl p-3.5 border border-stone-200 text-xs text-stone-700 leading-relaxed">
                            ${route.approach}
                        </div>
                    </div>

                    ${!isFalesia ? `
                    <!-- Relazione Tiro per Tiro (Multipitch) -->
                    <div class="px-4 pt-5">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500">2. Relazione Tiro per Tiro</h2>
                            <span class="text-[11px] text-stone-400">Spunta i tiri saliti</span>
                        </div>

                        <div class="space-y-2">
                            ${route.pitches.map((pitch, idx) => {
                                const isExpanded = state.expandedPitchIndex === idx;
                                const isPitchDone = !!state.checkedPitches[`${route.id}_${idx}`];
                                const pGradeClass = getGradeBadgeColor(pitch.grade);

                                return `
                                    <div
                                        id="pitch-card-${idx}"
                                        class="bg-white rounded-2xl border transition overflow-hidden ${
                                            isExpanded ? 'border-orange-400 shadow-xs' : 'border-stone-200'
                                        }"
                                    >
                                        <div
                                            onclick="togglePitchAccordion(${idx})"
                                            class="p-3 flex items-center justify-between gap-2 cursor-pointer select-none ${
                                                isPitchDone ? 'bg-emerald-50/40' : ''
                                            }"
                                        >
                                            <div class="flex items-center gap-2.5">
                                                <button
                                                    onclick="togglePitchChecked('${route.id}', ${idx}, event)"
                                                    title="Spunta tiro completato"
                                                    class="w-5 h-5 rounded-md border flex items-center justify-center transition shrink-0 ${
                                                        isPitchDone
                                                            ? 'bg-emerald-600 border-emerald-600 text-white'
                                                            : 'border-stone-300 bg-white hover:border-orange-500'
                                                    }"
                                                >
                                                    ${isPitchDone ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>' : ''}
                                                </button>

                                                <span class="font-mono-code text-xs font-extrabold text-stone-900">${pitch.num}</span>
                                                <span class="font-mono-code text-xs font-bold px-2 py-0.5 rounded border ${pGradeClass}">${pitch.grade}</span>
                                                <span class="text-xs font-medium text-stone-500">${pitch.length} • ${pitch.bolts}</span>
                                            </div>

                                            <svg class="w-4 h-4 text-stone-400 transition-transform ${isExpanded ? 'rotate-180 text-orange-600' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                            </svg>
                                        </div>

                                        ${isExpanded ? `
                                            <div class="px-3.5 pb-3.5 pt-1 text-xs text-stone-700 leading-relaxed border-t border-stone-100 bg-stone-50/50">
                                                ${pitch.desc}
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    ` : `
                    <!-- Elenco Monotiri della Falesia -->
                    <div class="px-4 pt-5">
                        <div class="flex items-center justify-between mb-2">
                            <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500">2. Elenco Vie della Falesia</h2>
                            <span class="text-[11px] text-stone-400">${route.cragRoutes.length} tiri</span>
                        </div>

                        ${route.cragRoutes.length === 0 ? `
                            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-xs text-rose-900">
                                Area dismessa con divieto di accesso da parte della proprietà della cava.
                            </div>
                        ` : `
                            <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden divide-y divide-stone-100">
                                ${route.cragRoutes.map((cr, idx) => `
                                    <div class="px-3.5 py-2.5 flex items-center justify-between gap-2 text-xs">
                                        <div>
                                            ${cr.sectorTag ? `<span class="text-[10px] font-bold uppercase text-orange-700 block">${cr.sectorTag}</span>` : ''}
                                            <span class="font-semibold text-stone-900">${idx + 1}. ${cr.name}</span>
                                            ${cr.meters && cr.meters !== '-' ? `<span class="text-stone-400 ml-1">(${cr.meters})</span>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            ${cr.stars ? `<span class="text-[11px] text-amber-500 font-bold tracking-tighter">${cr.stars}</span>` : ''}
                                            <span class="font-mono-code font-bold px-2 py-0.5 rounded bg-stone-100 text-stone-800 border border-stone-200">
                                                ${cr.grade}
                                            </span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                    `}

                    <!-- Discesa -->
                    <div class="px-4 pt-5">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-stone-500 mb-2">3. Discesa / Calata</h2>
                        <div class="bg-amber-50/70 rounded-2xl p-3.5 border border-amber-200/80 text-xs text-stone-800 leading-relaxed">
                            ${route.descent}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // LOGICA DI FILTRO, NAVIGAZIONE E AZIONI
        // ==========================================
        function getFilteredRoutes() {
            return routesData.filter(route => {
                if (state.selectedSectorId !== 'all' && route.sectorId !== state.selectedSectorId) {
                    return false;
                }

                if (state.onlyCompleted) {
                    return state.completedRoutes.includes(route.id);
                }

                if (state.searchQuery.trim() !== '') {
                    const q = state.searchQuery.toLowerCase();
                    const matchName = route.name.toLowerCase().includes(q);
                    const matchSector = route.sector.toLowerCase().includes(q);
                    const matchGrade = route.gradeMax.toLowerCase().includes(q) || route.gradeObbl.toLowerCase().includes(q);
                    const matchCrag = route.cragRoutes && route.cragRoutes.some(c => c.name.toLowerCase().includes(q));
                    if (!matchName && !matchSector && !matchGrade && !matchCrag) return false;
                }

                if (state.activeFilter === 'multipitch') {
                    return route.type === 'multipitch';
                }
                if (state.activeFilter === 'falesia') {
                    return route.type === 'falesia';
                }
                if (state.activeFilter === 'easy') {
                    return route.difficultyLevel === 'facile';
                }
                if (state.activeFilter === 'trad') {
                    return route.protectionCategory === 'trad';
                }

                return true;
            });
        }

        function updateSearch(val) {
            state.searchQuery = val;
            const listContainer = document.getElementById('routes-list-wrapper');
            if (listContainer) {
                listContainer.innerHTML = generateRoutesCardsHTML();
            }
        }

        function setFilter(filterKey) {
            state.activeFilter = filterKey;
            state.onlyCompleted = false;
            render();
        }

        function setSectorFilter(sectorId) {
            state.selectedSectorId = sectorId;
            state.onlyCompleted = false;
            render();
        }

        function openSectorRoutes(sectorId) {
            state.selectedSectorId = sectorId;
            state.onlyCompleted = false;
            state.view = 'routes';
            render();
        }

        function openIntroChapter(chapterId) {
            state.selectedIntroId = chapterId;
            state.view = 'intro';
            render();
        }

        function toggleOnlyCompleted() {
            state.onlyCompleted = !state.onlyCompleted;
            render();
        }

        function openRouteDetail(routeId) {
            state.selectedRouteId = routeId;
            state.view = 'detail';
            state.expandedPitchIndex = 0;
            render();
        }

        function navigateTo(viewName) {
            state.view = viewName;
            if (viewName === 'intro') {
                state.selectedIntroId = null;
            }
            if (viewName !== 'detail') {
                state.selectedRouteId = null;
            }
            render();
        }

        function toggleRouteCompleted(routeId) {
            const idx = state.completedRoutes.indexOf(routeId);
            if (idx > -1) {
                state.completedRoutes.splice(idx, 1);
                showToast('Via rimossa dalle salite completate');
            } else {
                state.completedRoutes.push(routeId);
                showToast('Complimenti! Via segnata come salita');
            }
            saveState();
            render();
        }

        function togglePitchAccordion(idx) {
            state.expandedPitchIndex = state.expandedPitchIndex === idx ? -1 : idx;
            render();
        }

        function focusPitchFromSvg(pitchIdx) {
            state.expandedPitchIndex = pitchIdx;
            render();
            setTimeout(() => {
                const el = document.getElementById(`pitch-card-${pitchIdx}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 60);
        }

        function togglePitchChecked(routeId, pitchIdx, event) {
            event.stopPropagation();
            const key = `${routeId}_${pitchIdx}`;
            if (state.checkedPitches[key]) {
                delete state.checkedPitches[key];
            } else {
                state.checkedPitches[key] = true;
            }
            saveState();
            render();
        }

        function copyGpsCoords(coords) {
            const tempInput = document.createElement('input');
            tempInput.value = coords;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`Coordinate GPS copiate: ${coords}`);
        }

        function openPhotoLightbox(imgUrl, caption) {
            const box = document.getElementById('photo-lightbox');
            const img = document.getElementById('lightbox-img');
            const cap = document.getElementById('lightbox-caption');
            if (!box || !img || !cap) return;
            img.src = imgUrl;
            cap.textContent = caption || '';
            box.classList.remove('hidden');
        }

        function closePhotoLightbox() {
            const box = document.getElementById('photo-lightbox');
            if (box) box.classList.add('hidden');
        }

        function updateBottomNavUI() {
            const navHome = document.getElementById('nav-home');
            const navIntro = document.getElementById('nav-intro');
            const navRoutes = document.getElementById('nav-routes');

            const activeCls = 'flex flex-col items-center gap-0.5 text-orange-600 font-semibold text-xs px-3 py-1.5 rounded-xl transition';
            const inactiveCls = 'flex flex-col items-center gap-0.5 text-stone-500 hover:text-stone-800 font-medium text-xs px-3 py-1.5 rounded-xl transition';

            if (navHome) navHome.className = state.view === 'home' ? activeCls : inactiveCls;
            if (navIntro) navIntro.className = state.view === 'intro' ? activeCls : inactiveCls;
            if (navRoutes) navRoutes.className = (state.view === 'routes' || state.view === 'detail') ? activeCls : inactiveCls;
        }

        // ==========================================
        // RENDER PRINCIPALE
        // ==========================================
        function render() {
            const container = document.getElementById('app-scroll-container');
            if (!container) return;

            if (state.view === 'home') {
                container.innerHTML = renderHomeScreen();
            } else if (state.view === 'intro') {
                container.innerHTML = renderIntroScreen();
            } else if (state.view === 'detail') {
                container.innerHTML = renderDetailView();
            } else {
                container.innerHTML = renderRoutesListView();
            }

            updateBottomNavUI();
            container.scrollTop = 0;
        }

        // ==========================================
        // INIZIALIZZAZIONE
        // ==========================================
        window.onload = function() {
            updateCompletedCounter();
            render();
        };
    </script>
</body>
</html>
